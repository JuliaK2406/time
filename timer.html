<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FAF8F5">
  <title>Timer · Julia Krylova</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/lora-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <span></span>
    <a class="btn btn--nav" href="index.html">Clock</a>
  </header>

  <main class="stage stage--timer">
    <p class="timer__digits" id="digits" role="timer" aria-label="Time remaining">05:00</p>

    <!-- 8 x 5 tiles, filled in by timer.js -->
    <div class="mosaic" id="mosaic" aria-hidden="true"></div>

    <div class="finish" aria-live="polite">
      <span class="finish__line"></span>
      <p class="finish__text" id="finish-text">Time’s up</p>
    </div>

    <div class="controls">
      <div class="controls__row">
        <div class="controls__group" role="group" aria-label="Duration in minutes">
          <span class="controls__label">Minutes</span>
          <button class="chip" type="button" data-min="1">1</button>
          <button class="chip" type="button" data-min="2">2</button>
          <button class="chip" type="button" data-min="3">3</button>
          <button class="chip" type="button" data-min="5">5</button>
          <button class="chip" type="button" data-min="10">10</button>
          <button class="chip" type="button" data-min="15">15</button>
          <input class="custom__input" id="custom" type="number" min="1" max="120" step="1"
                 inputmode="numeric" placeholder="1 to 120" aria-label="Your own number of minutes, 1 to 120">
        </div>
        <div class="controls__group">
          <button class="btn btn--primary" type="button" id="toggle">Start</button>
          <button class="btn" type="button" id="reset">Reset</button>
          <button class="btn" type="button" id="fullscreen">Full screen</button>
        </div>
      </div>
      <p class="controls__hint">Space: start and pause · R: reset · F: full screen</p>
    </div>
  </main>

  <footer class="foot">Julia Krylova</footer>

  <script src="timer.js"></script>
</body>
</html>
